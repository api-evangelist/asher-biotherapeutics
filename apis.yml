aid: asher-biotherapeutics
name: Asher Biotherapeutics
description: 'Asher Biotherapeutics (Asher Bio) is a privately held, clinical-stage
  biotechnology company founded in 2019 and headquartered at 650 Gateway Blvd. in
  South San Francisco, California. The company develops cis-targeted immunotherapies
  — engineered biologics that simultaneously engage an immunomodulatory receptor and
  a cell-type-specific target on the same immune cell, so a cytokine is only activated
  on the intended cell population rather than acting indiscriminately across immune
  subsets. Its lead candidate, etakafusp alfa (AB248), is a cis-targeted IL-2 directed
  at CD8+ effector T cells and is in Phase 1a/1b clinical development in cancer, alongside
  earlier-stage programs AB821 and AB359 and a cis-targeted cytokine augmentation
  program for cell therapies. Asher Bio is a therapeutics developer, not a software
  or platform company: it publishes no developer program, public API, SDK, or machine-readable
  interface.'
